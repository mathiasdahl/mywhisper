[package]
name = "mywhisper"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
crossterm = "0.28"
hound = "3.5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3.4"
chrono = "0.4"
dirs = "6"
